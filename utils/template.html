<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup - Medium</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <!-- Header (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Medium</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link btn btn-dark text-white px-3" href="#"
                >Sign Up</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Signup Form -->
    <div
      class="container d-flex justify-content-center align-items-center flex-grow-1"
    >
      <div class="card p-4 shadow-lg" style="width: 400px">
        <h2 class="text-center mb-4">Sign Up</h2>
        <form id="signupForm">
          <div class="mb-3">
            <label class="form-label" for="name">Full Name</label>
            <input
              type="text"
              id="name"
              class="form-control"
              placeholder="Full Name"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input
              type="text"
              id="email"
              class="form-control"
              placeholder="Email"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input
              type="text"
              id="password"
              class="form-control"
              placeholder="Password"
              required
            />
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign Up</button>
          <p class="text-center mt-3">
            Already have an account? <a href="login.html">Log In</a>
          </p>
        </form>
      </div>
    </div>
    <!-- footer area -->
    <footer class="bg-white text-center py-3 shadow-sm mt-4">
      <p class="mb-0">© 2025 Medium Clone. All rights reserved.</p>
    </footer>
    
    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Signup successfully.");
        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
